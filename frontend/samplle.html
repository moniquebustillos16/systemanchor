<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Anchor — Enterprise Warehouse Management System</title>
<style>
:root {
  /* Palette derived from the provided image */
  --cream: #F7F5F0;
  --beige: #E8E2D8;
  --tan: #C4A882;
  --brown: #8B6B4A;
  --sage: #6A7A58;
  --deep: #2C241B;
  --deep-soft: #3D3228;

  --primary: #8B6B4A;
  --primary-dark: #6F5338;
  --primary-soft: rgba(139, 107, 74, 0.12);
  --secondary: #6A7A58;
  --secondary-soft: rgba(106, 122, 88, 0.12);
  --success: #5C7A4E;
  --danger: #B85C4A;
  --warning: #C49A5A;
  --info: #6A7A58;

  --sidebar: #2A221A;
  --sidebar-hover: #3A3128;
  --bg: #F7F5F0;
  --card: #FFFEFB;
  --text: #2C241B;
  --text-muted: #7A6B58;
  --border: #E5DED3;
  --shadow: 0 4px 20px -4px rgba(44, 36, 27, 0.08), 0 2px 8px -2px rgba(44, 36, 27, 0.04);
  --shadow-lg: 0 16px 40px -8px rgba(44, 36, 27, 0.12), 0 6px 16px -4px rgba(44, 36, 27, 0.06);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 18px;
  --header-h: 68px;
  --sidebar-w: 268px;
  --sidebar-collapsed: 76px;
  --transition: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg: #1A1612;
  --card: #2A241C;
  --text: #F5F0E8;
  --text-muted: #A89880;
  --border: #3D342A;
  --shadow: 0 4px 20px -4px rgba(0,0,0,0.4);
  --shadow-lg: 0 16px 40px -8px rgba(0,0,0,0.5);
  --sidebar: #12100C;
  --sidebar-hover: #1F1A14;
  --primary-soft: rgba(196, 168, 130, 0.15);
  --secondary-soft: rgba(106, 122, 88, 0.18);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 14.5px; scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  overflow-x: hidden;
  transition: background var(--transition), color var(--transition);
  -webkit-font-smoothing: antialiased;
}

a { color: var(--primary); text-decoration: none; transition: color 0.15s; }
a:hover { color: var(--primary-dark); }
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; outline: none; }

/* ---------- Loading Screen ---------- */
#loading-screen {
  position: fixed; inset: 0;
  background: linear-gradient(160deg, #2A221A 0%, #3D3228 50%, #2A221A 100%);
  z-index: 99999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.55s, visibility 0.55s;
}
#loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-logo {
  width: 78px; height: 78px;
  background: linear-gradient(145deg, #C4A882, #8B6B4A);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 28px;
  box-shadow: 0 0 50px rgba(196, 168, 130, 0.35), 0 12px 30px rgba(0,0,0,0.3);
  animation: pulse 1.6s ease-in-out infinite;
}
.loader-logo svg { width: 42px; height: 42px; fill: #FFFEFB; }
.loader-text { color: #A89880; font-size: 14.5px; margin-top: 10px; letter-spacing: 0.02em; }
.loader-bar {
  width: 220px; height: 5px; background: rgba(255,255,255,0.08);
  border-radius: 6px; margin-top: 24px; overflow: hidden;
}
.loader-bar-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, #C4A882, #6A7A58);
  border-radius: 6px;
  animation: loadProgress 1.9s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
@keyframes loadProgress { to { width: 100%; } }

/* ---------- Login ---------- */
#login-page {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(196,168,130,0.12) 0%, transparent 50%),
    radial-gradient(ellipse 70% 50% at 80% 80%, rgba(106,122,88,0.1) 0%, transparent 50%),
    linear-gradient(155deg, #2A221A 0%, #3D3228 45%, #2A221A 100%);
  position: relative; overflow: hidden;
}
#login-page::before {
  content: ''; position: absolute; width: 520px; height: 520px;
  background: radial-gradient(circle, rgba(196,168,130,0.18) 0%, transparent 68%);
  top: -180px; right: -80px; filter: blur(2px);
}
#login-page::after {
  content: ''; position: absolute; width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(106,122,88,0.12) 0%, transparent 70%);
  bottom: -120px; left: -60px;
}
.login-card {
  width: 430px; max-width: 94%;
  background: rgba(42, 34, 26, 0.72);
  backdrop-filter: blur(28px) saturate(1.2);
  -webkit-backdrop-filter: blur(28px) saturate(1.2);
  border: 1px solid rgba(232, 226, 216, 0.12);
  border-radius: 24px;
  padding: 44px 40px;
  box-shadow: 0 32px 64px -16px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  position: relative; z-index: 1;
}
.login-logo {
  display: flex; align-items: center; gap: 14px; margin-bottom: 36px; justify-content: center;
}
.login-logo-icon {
  width: 52px; height: 52px;
  background: linear-gradient(145deg, #C4A882, #8B6B4A);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 20px rgba(139,107,74,0.35);
}
.login-logo-icon svg { width: 28px; height: 28px; fill: #FFFEFB; }
.login-logo h1 { color: #F5F0E8; font-size: 23px; font-weight: 700; letter-spacing: -0.02em; }
.login-logo span { color: #A89880; font-size: 12.5px; display: block; margin-top: 2px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; color: #C4B8A8; font-size: 13px; margin-bottom: 7px; font-weight: 500; letter-spacing: 0.01em; }
.form-group input {
  width: 100%; padding: 13px 15px;
  background: rgba(26, 22, 18, 0.55);
  border: 1px solid rgba(232, 226, 216, 0.14);
  border-radius: 12px; color: #F5F0E8; font-size: 14.5px;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.form-group input:focus {
  border-color: var(--tan);
  box-shadow: 0 0 0 3.5px rgba(196, 168, 130, 0.22);
  background: rgba(26, 22, 18, 0.7);
}
.form-group input::placeholder { color: #7A6B58; }
.password-wrap { position: relative; }
.password-wrap button {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; color: #A89880; font-size: 13px; padding: 4px 6px;
  border-radius: 6px; transition: color 0.15s;
}
.password-wrap button:hover { color: #C4A882; }
.login-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
.login-options label { color: #A89880; font-size: 13px; display: flex; align-items: center; gap: 7px; cursor: pointer; }
.login-options a { color: var(--tan); font-size: 13px; }
.login-options a:hover { color: #D4B892; }
.btn-primary {
  width: 100%; padding: 14px;
  background: linear-gradient(145deg, #C4A882, #8B6B4A);
  color: #FFFEFB; border-radius: 12px; font-size: 15px; font-weight: 600;
  letter-spacing: 0.01em;
  transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
  position: relative; overflow: hidden;
  box-shadow: 0 6px 18px rgba(139,107,74,0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 26px rgba(139,107,74,0.4);
  filter: brightness(1.05);
}
.btn-primary:active { transform: translateY(0); }
.btn-primary.loading { pointer-events: none; opacity: 0.85; }
.btn-primary .spinner {
  display: none; width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.7s linear infinite; margin: 0 auto;
}
.btn-primary.loading .btn-text { display: none; }
.btn-primary.loading .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.login-footer { text-align: center; margin-top: 28px; color: #7A6B58; font-size: 12px; letter-spacing: 0.02em; }

/* ---------- App Shell ---------- */
#app { display: none; min-height: 100vh; }
#app.active { display: flex; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar);
  color: #D4C8B8;
  height: 100vh; position: fixed; left: 0; top: 0; z-index: 100;
  display: flex; flex-direction: column;
  transition: width var(--transition);
  overflow: hidden;
  border-right: 1px solid rgba(232,226,216,0.06);
}
.sidebar.collapsed { width: var(--sidebar-collapsed); }
.sidebar-header {
  height: var(--header-h);
  display: flex; align-items: center; padding: 0 18px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  gap: 13px; flex-shrink: 0;
}
.sidebar-logo {
  width: 38px; height: 38px;
  background: linear-gradient(145deg, #C4A882, #8B6B4A);
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(139,107,74,0.35);
}
.sidebar-logo svg { width: 20px; height: 20px; fill: #FFFEFB; }
.sidebar-brand {
  font-weight: 700; font-size: 16.5px; color: #F5F0E8;
  white-space: nowrap; opacity: 1; transition: opacity 0.2s;
  letter-spacing: -0.01em;
}
.sidebar.collapsed .sidebar-brand { opacity: 0; width: 0; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 14px 12px; }
.sidebar-nav::-webkit-scrollbar { width: 4px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: #4A4035; border-radius: 4px; }
.nav-section { margin-bottom: 10px; }
.nav-section-title {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
  color: #8A7A68; padding: 10px 12px 6px; font-weight: 600;
  white-space: nowrap; transition: opacity 0.2s;
}
.sidebar.collapsed .nav-section-title { opacity: 0; height: 0; padding: 0; overflow: hidden; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 13px; border-radius: 11px;
  color: #B8A898; cursor: pointer;
  transition: all 0.18s; margin-bottom: 2px;
  white-space: nowrap; font-size: 13.5px; font-weight: 500;
}
.nav-item:hover { background: var(--sidebar-hover); color: #F0E8DC; }
.nav-item.active {
  background: linear-gradient(135deg, rgba(196,168,130,0.22), rgba(139,107,74,0.18));
  color: #E8D5B8;
  box-shadow: inset 0 0 0 1px rgba(196,168,130,0.15);
}
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.75; }
.nav-item span { transition: opacity 0.2s; }
.sidebar.collapsed .nav-item span { opacity: 0; width: 0; overflow: hidden; }
.nav-item .badge {
  margin-left: auto; background: var(--danger); color: white;
  font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
}
.sidebar.collapsed .nav-item .badge { display: none; }
.nav-group-toggle { justify-content: space-between; }
.nav-group-toggle .chevron { transition: transform 0.22s; width: 16px; height: 16px; }
.nav-group.open .nav-group-toggle .chevron { transform: rotate(90deg); }
.nav-sub { max-height: 0; overflow: hidden; transition: max-height 0.32s ease; padding-left: 8px; }
.nav-group.open .nav-sub { max-height: 520px; }
.nav-sub .nav-item { padding: 8px 12px 8px 34px; font-size: 13px; }
.sidebar.collapsed .nav-sub { display: none; }

/* ---------- Main Content ---------- */
.main-wrap {
  margin-left: var(--sidebar-w); flex: 1; min-height: 100vh;
  display: flex; flex-direction: column;
  transition: margin-left var(--transition);
}
.sidebar.collapsed ~ .main-wrap { margin-left: var(--sidebar-collapsed); }

/* ---------- Header ---------- */
.header {
  height: var(--header-h);
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 26px; gap: 16px;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 1px 0 var(--border), 0 4px 16px -6px rgba(44,36,27,0.04);
}
.header-toggle {
  width: 38px; height: 38px; border-radius: 10px; background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); transition: background 0.15s, color 0.15s;
}
.header-toggle:hover { background: var(--beige); color: var(--text); }
.header-toggle svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.global-search { flex: 1; max-width: 460px; position: relative; }
.global-search input {
  width: 100%; padding: 11px 15px 11px 42px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 12px; font-size: 13.5px; color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.global-search input:focus {
  border-color: var(--tan);
  box-shadow: 0 0 0 3.5px rgba(196,168,130,0.18);
  background: var(--card);
}
.global-search svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2;
}
.search-results {
  position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow-lg);
  max-height: 380px; overflow-y: auto; display: none; z-index: 100;
}
.search-results.show { display: block; animation: fadeIn 0.18s ease; }
.search-result-item {
  padding: 12px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border); transition: background 0.12s;
}
.search-result-item:hover { background: var(--bg); }
.search-result-item:last-child { border-bottom: none; }
.search-result-type {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
  background: var(--primary-soft); color: var(--primary);
  padding: 3px 8px; border-radius: 6px; font-weight: 600;
}
.header-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.header-btn {
  width: 40px; height: 40px; border-radius: 11px; background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); position: relative;
  transition: background 0.15s, color 0.15s;
}
.header-btn:hover { background: var(--beige); color: var(--text); }
.header-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; }
.header-btn .dot {
  position: absolute; top: 9px; right: 9px; width: 8px; height: 8px;
  background: var(--danger); border-radius: 50%; border: 2px solid var(--card);
}
.user-menu { position: relative; }
.user-avatar {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(145deg, #C4A882, #8B6B4A);
  display: flex; align-items: center; justify-content: center;
  color: #FFFEFB; font-weight: 600; font-size: 13px; cursor: pointer;
  box-shadow: 0 3px 10px rgba(139,107,74,0.25);
  transition: transform 0.15s, box-shadow 0.15s;
}
.user-avatar:hover { transform: scale(1.04); box-shadow: 0 5px 14px rgba(139,107,74,0.35); }
.dropdown-menu {
  position: absolute; top: 100%; right: 0; margin-top: 10px; min-width: 210px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow-lg);
  display: none; z-index: 100; overflow: hidden;
}
.dropdown-menu.show { display: block; animation: fadeIn 0.16s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(-6px) } to { opacity:1; transform:none } }
.dropdown-item {
  padding: 11px 16px; display: flex; align-items: center; gap: 11px; cursor: pointer;
  color: var(--text); font-size: 13.5px; transition: background 0.12s;
}
.dropdown-item:hover { background: var(--bg); }
.dropdown-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.dropdown-divider { height: 1px; background: var(--border); margin: 5px 0; }

/* ---------- Content ---------- */
.content { flex: 1; padding: 28px; overflow-y: auto; }
.page { display: none; animation: pageIn 0.32s cubic-bezier(0.4,0,0.2,1); }
.page.active { display: block; }
@keyframes pageIn { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 26px; flex-wrap: wrap; gap: 14px;
}
.page-title { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.page-subtitle { color: var(--text-muted); font-size: 13.5px; margin-top: 3px; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 18px; border-radius: 11px;
  font-size: 13.5px; font-weight: 550;
  transition: all 0.18s; letter-spacing: 0.01em;
}
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.btn-primary {
  background: linear-gradient(145deg, #C4A882, #8B6B4A);
  color: #FFFEFB; box-shadow: 0 4px 12px rgba(139,107,74,0.25);
}
.btn-primary:hover {
  background: linear-gradient(145deg, #D0B48E, #7A5C3E);
  transform: translateY(-1px); box-shadow: 0 6px 18px rgba(139,107,74,0.32);
}
.btn-secondary {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(44,36,27,0.04);
}
.btn-secondary:hover { background: var(--beige); border-color: var(--tan); }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-sm { padding: 7px 13px; font-size: 12.5px; border-radius: 9px; }
.btn-icon { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 9px; }

/* ---------- Cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; transition: box-shadow 0.2s, border-color 0.2s;
}
.card:hover { box-shadow: var(--shadow-lg); }
.card-header {
  padding: 18px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, rgba(247,245,240,0.5) 0%, transparent 100%);
}
[data-theme="dark"] .card-header { background: linear-gradient(180deg, rgba(42,36,28,0.6) 0%, transparent 100%); }
.card-title { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
.card-body { padding: 22px; }

/* ---------- Stats Grid ---------- */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 18px; margin-bottom: 26px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
  transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--tan), var(--sage));
  opacity: 0.85;
}
.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(196,168,130,0.35);
}
.stat-card .stat-icon {
  width: 46px; height: 46px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
  background: linear-gradient(145deg, rgba(196,168,130,0.2), rgba(139,107,74,0.15));
}
.stat-card .stat-icon svg { width: 22px; height: 22px; stroke: var(--primary); fill: none; stroke-width: 2; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; margin-bottom: 3px; letter-spacing: -0.02em; }
.stat-card .stat-label { color: var(--text-muted); font-size: 13px; font-weight: 500; }
.stat-card .stat-change {
  position: absolute; top: 20px; right: 18px;
  font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 8px;
}
.stat-change.up { background: rgba(92,122,78,0.14); color: var(--success); }
.stat-change.down { background: rgba(184,92,74,0.14); color: var(--danger); }

/* ---------- Charts ---------- */
.charts-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 18px; margin-bottom: 26px;
}
.chart-container { height: 270px; position: relative; }
.chart-container canvas { width: 100% !important; height: 100% !important; }

/* ---------- Tables ---------- */
.table-toolbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
}
.table-search { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
.table-search input {
  width: 100%; padding: 9px 13px 9px 38px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; font-size: 13px; color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.table-search input:focus {
  border-color: var(--tan);
  box-shadow: 0 0 0 3px rgba(196,168,130,0.15);
}
.table-search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);

    document.getElementById('loading-screen').classList.add('hidden');
  }, 1800);
  buildSidebar();
  renderNotifications();
});

function handleLogin(e) {
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!user || !pass) {
    showToast('error', 'Validation Error', 'Username and password are required.');
    return false;
  }
  if (user !== 'admin' || pass !== 'admin123') {
    showToast('error', 'Login Failed', 'Invalid username or password.');
    return false;
  }
  const btn = document.getElementById('login-btn');
  btn.classList.add('loading');
  setTimeout(() => {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('app').classList.add('active');
    navigateTo('dashboard');
    showToast('success', 'Welcome back!', 'Successfully signed in to System Anchor WMS.');
    btn.classList.remove('loading');
  }, 1200);
  return false;
}

function togglePassword() {
  const input = document.getElementById('login-pass');
  const btn = input.nextElementSibling;
  if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
  else { input.type = 'password'; btn.textContent = 'Show'; }
}

function handleLogout() {
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('user-dropdown').classList.remove('show');
  showToast('info', 'Signed Out', 'You have been successfully signed out.');
}

// -------------------- SIDEBAR --------------------
function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');
  let html = '';
  NAV.forEach(item => {
    if (item.id) {
      html += `<div class="nav-item ${item.id===currentPage?'active':''}" onclick="navigateTo('${item.id}')">${icon(item.icon)}<span>${item.label}</span></div>`;
    } else {
      html += `<div class="nav-section"><div class="nav-section-title">${item.section}</div>`;
      html += `<div class="nav-group" id="group-${item.section.replace(/\s/g,'-')}">`;
      item.items.forEach(sub => {
        html += `<div class="nav-item ${sub.id===currentPage?'active':''}" onclick="navigateTo('${sub.id}')">${icon(sub.icon)}<span>${sub.label}</span></div>`;
      });
      html += `</div></div>`;
    }
  });
  nav.innerHTML = html;
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (window.innerWidth <= 900) {
    sb.classList.toggle('mobile-open');
  } else {
    sidebarCollapsed = !sidebarCollapsed;
    sb.classList.toggle('collapsed', sidebarCollapsed);
  }
}

// -------------------- NAVIGATION --------------------
function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`.nav-item`).forEach(el => {
    if (el.getAttribute('onclick') && el.getAttribute('onclick').includes(`'${page}'`)) el.classList.add('active');
  });
  const content = document.getElementById('content');
  content.innerHTML = getPageHTML(page);

}

function initTables(page) {
  const configs = {
    products: {
      data: DATA.products,
      render: (p) => `<tr>
        <td class="fw-600">${p.sku}</td>
        <td><div class="flex items-center gap-8"><div class="product-img">📦</div>${p.name}</div></td>
        <td>${p.category}</td><td>${p.warehouse}</td>
        <td>${p.qty.toLocaleString()}</td>
        <td>$${p.price.toFixed(2)}</td>
        <td><span class="status-badge status-${p.status}">${p.status.replace('-',' ')}</span></td>
        <td>
          <button class="btn btn-sm btn-secondary btn-icon" onclick="viewProduct(${p.id})" data-tooltip="View">${icon('file',14)}</button>
          <button class="btn btn-sm btn-secondary btn-icon" onclick="editProduct(${p.id})" data-tooltip="Edit">${icon('settings',14)}</button>
          <button class="btn btn-sm btn-danger btn-icon" onclick="deleteProduct(${p.id})" data-tooltip="Delete">${icon('minus-circle',14)}</button>
        </td>
      </tr>`,
      filter: (p, q, status, cat) => {
        const matchQ = !q || p.sku.toLowerCase().includes(q) || p.name.toLowerCase().includes(q);
        const matchS = !status || p.status === status;
        const matchC = !cat || p.category === cat;
        return matchQ && matchS && matchC;
      },
      getFilters: () => ({
        q: document.getElementById('products-search')?.value.toLowerCase() || '',
        status: document.getElementById('products-filter-status')?.value || '',
        cat: document.getElementById('products-filter-cat')?.value || ''
      })
    },
    inventory: {
      data: DATA.products,

  renderTablePage(page, conf);
}

function renderTablePage(page, conf) {
  const state = tableStates[page];
  const filters = conf.getFilters();
  let filtered = conf.data.filter(row => conf.filter(row, ...Object.values(filters)));
  if (state.sortCol !== null) {
    filtered.sort((a, b) => {
      const cols = Object.keys(a);
      const va = a[cols[state.sortCol]] ?? Object.values(a)[state.sortCol];
      const vb = b[cols[state.sortCol]] ?? Object.values(b)[state.sortCol];
      if (typeof va === 'number') return (va - vb) * state.sortDir;
      return String(va).localeCompare(String(vb)) * state.sortDir;
    });
  }
  const total = filtered.length;
  const pages = Math.ceil(total / state.perPage) || 1;
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * state.perPage;
  const slice = filtered.slice(start, start + state.perPage);
  const tbody = document.getElementById(`${page}-tbody`);
  if (tbody) tbody.innerHTML = slice.map(conf.render).join('') || '<tr><td colspan="10" class="empty-state">No records found</td></tr>';
  const pag = document.getElementById(`${page}-pagination`);
  if (pag) {
    let btns = '';
    for (let i = 1; i <= pages; i++) {
      btns += `<button class="${i===state.page?'active':''}" onclick="goToPage('${page}',${i})">${i}</button>`;
    }
    pag.innerHTML = `
      <div class="pagination-info">Showing ${total?start+1:0}–${Math.min(start+state.perPage,total)} of ${total}</div>
      <div class="pagination-btns">
        <button ${state.page<=1?'disabled':''} onclick="goToPage('${page}',${state.page-1})">‹</button>
        ${btns}
        <button ${state.page>=pages?'disabled':''} onclick="goToPage('${page}',${state.page+1})">›</button>
      </div>`;
  }
}

function filterTable(page) {
  if (tableStates[page]) tableStates[page].page = 1;
  initTables(page);
}

function sortTable(page, col) {
  const state = tableStates[page] || (tableStates[page] = { page:1, perPage:8, sortCol:null, sortDir:1 });
  if (state.sortCol === col) state.sortDir *= -1;
  else { state.sortCol = col; state.sortDir = 1; }
  initTables(page);
}

function goToPage(page, n) {
  tableStates[page].page = n;
  initTables(page);
}

function getChartCtx(id) {
  const canvas = document.getElementById(id);
  if (!canvas) return null;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: rect.height };
}

function drawLineChart(id, labels, data, color) {
  const c = getChartCtx(id); if (!c) return;
  const { ctx, w, h } = c;
  const pad = { t:20, r:20, b:40, l:50 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const max = Math.max(...data) * 1.15;
  const min = 0;
  ctx.clearRect(0,0,w,h);
  // Grid
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#E2E8F0';
  ctx.lineWidth = 1;
  for (let i=0;i<=4;i++) {
    const y = pad.t + (ch/4)*i;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#64748B';
    ctx.font = '11px Inter,sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(max - (max/4)*i), pad.l - 8, y + 4);
  }
  // Line
  ctx.beginPath();
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  data.forEach((v,i) => {
    const x = pad.l + (cw/(data.length-1))*i;
    const y = pad.t + ch - (v/max)*ch;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
  // Points
  data.forEach((v,i) => {
    const x = pad.l + (cw/(data.length-1))*i;
    const y = pad.t + ch - (v/max)*ch;
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  });
  // Labels
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#64748B';
  ctx.font = '11px Inter,sans-serif'; ctx.textAlign = 'center';
  labels.forEach((l,i) => {
    const x = pad.l + (cw/(labels.length-1))*i;
    ctx.fillText(l, x, h - 12);
  });
}

function drawBarChart(id, labels, data, color) {
  const c = getChartCtx(id); if (!c) return;
  const { ctx, w, h } = c;
  const pad = { t:20, r:20, b:40, l:50 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const max = Math.max(...data) * 1.2;
  const barW = cw / data.length * 0.6;
  ctx.clearRect(0,0,w,h);
  data.forEach((v,i) => {
    const x = pad.l + (cw/data.length)*i + (cw/data.length - barW)/2;
    const bh = (v/max)*ch;
    const y = pad.t + ch - bh;
    const grad = ctx.createLinearGradient(0,y,0,y+bh);
    grad.addColorStop(0, color); grad.addColorStop(1, color + '99');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, bh, [6,6,0,0]);
    ctx.fill();
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#64748B';
    ctx.font = '11px Inter,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(labels[i], x + barW/2, h - 12);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#2C241B';
    ctx.font = '11px Inter,sans-serif';
    ctx.fillText(v + (id.includes('util')||id.includes('capacity')||id.includes('efficiency')?'%':''), x + barW/2, y - 6);
  });
}

function drawAreaChart(id, labels, data, color) {
  const c = getChartCtx(id); if (!c) return;
  const { ctx, w, h } = c;
  const pad = { t:20, r:20, b:40, l:50 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const max = Math.max(...data) * 1.15;
  ctx.clearRect(0,0,w,h);
  // Area
  ctx.beginPath();
  data.forEach((v,i) => {
    const x = pad.l + (cw/(data.length-1))*i;
    const y = pad.t + ch - (v/max)*ch;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.l + cw, pad.t + ch);
  ctx.lineTo(pad.l, pad.t + ch);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
  grad.addColorStop(0, color + '40'); grad.addColorStop(1, color + '05');
  ctx.fillStyle = grad; ctx.fill();
  // Line
  ctx.beginPath();
  ctx.strokeStyle = color; ctx.lineWidth = 2.5;
  data.forEach((v,i) => {
    const x = pad.l + (cw/(data.length-1))*i;
    const y = pad.t + ch - (v/max)*ch;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#64748B';
  ctx.font = '11px Inter,sans-serif'; ctx.textAlign = 'center';
  labels.forEach((l,i) => ctx.fillText(l, pad.l + (cw/(labels.length-1))*i, h - 12));
}

function drawDonutChart(id, labels, data, colors) {
  const c = getChartCtx(id); if (!c) return;
  const { ctx, w, h } = c;
  const cx = w/2 - 40, cy = h/2, r = Math.min(w,h)/2 - 30, ir = r * 0.55;
  const total = data.reduce((a,b)=>a+b,0);
  let angle = -Math.PI/2;
  ctx.clearRect(0,0,w,h);
  data.forEach((v,i) => {
    const slice = (v/total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, angle, angle + slice);
    ctx.arc(cx, cy, ir, angle + slice, angle, true);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    angle += slice;
  });
  // Legend
  ctx.font = '12px Inter,sans-serif';
  labels.forEach((l,i) => {
    const y = 30 + i * 22;
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(w - 130, y - 8, 12, 12);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#2C241B';
    ctx.textAlign = 'left';
    ctx.fillText(l, w - 112, y + 2);
  });
}

  const name = document.getElementById('m-uname').value.trim();
  const email = document.getElementById('m-uemail').value.trim();

// -------------------- GLOBAL SEARCH --------------------
function handleGlobalSearch(q) {
  const box = document.getElementById('search-results');
  if (!q || q.length < 2) { box.classList.remove('show'); return; }
  const ql = q.toLowerCase();
  const results = [];
  DATA.products.forEach(p => { if (p.name.toLowerCase().includes(ql)||p.sku.toLowerCase().includes(ql)) results.push({type:'Product', label:p.sku+' — '+p.name, page:'products'}); });
  DATA.purchaseOrders.forEach(o => { if (o.id.toLowerCase().includes(ql)||o.supplier.toLowerCase().includes(ql)) results.push({type:'PO', label:o.id+' — '+o.supplier, page:'purchase-orders'}); });
  DATA.salesOrders.forEach(o => { if (o.id.toLowerCase().includes(ql)||o.customer.toLowerCase().includes(ql)) results.push({type:'SO', label:o.id+' — '+o.customer, page:'sales-orders'}); });
  DATA.warehouses.forEach(w => { if (w.name.toLowerCase().includes(ql)||w.code.toLowerCase().includes(ql)) results.push({type:'Warehouse', label:w.code+' — '+w.name, page:'warehouses'}); });
  DATA.suppliers.forEach(s => { if (s.name.toLowerCase().includes(ql)) results.push({type:'Supplier', label:s.name, page:'suppliers'}); });
  DATA.customers.forEach(c => { if (c.name.toLowerCase().includes(ql)) results.push({type:'Customer', label:c.name, page:'customers'}); });
  box.innerHTML = results.slice(0,8).map(r => `
    <div class="search-result-item" onclick="navigateTo('${r.page}');document.getElementById('search-results').classList.remove('show');document.getElementById('global-search').value=''">
      <span class="search-result-type">${r.type}</span>
      <span>${r.label}</span>
    </div>
  `).join('') || '<div class="search-result-item text-muted">No results found</div>';
  box.classList.add('show');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.global-search')) document.getElementById('search-results')?.classList.remove('show');
  if (!e.target.closest('.user-menu')) document.getElementById('user-dropdown')?.classList.remove('show');
  if (!e.target.closest('.header-btn') && !e.target.closest('.notif-panel')) document.getElementById('notif-panel')?.classList.remove('show');
});

// -------------------- NOTIFICATIONS --------------------
function renderNotifications() {
  const list = document.getElementById('notif-list');
  const unread = DATA.notifications.filter(n=>!n.read).length;
  document.getElementById('notif-dot').style.display = unread ? 'block' : 'none';
  const colors = {warning:'#C49A5A', success:'#5C7A4E', info:'#8B6B4A', danger:'#B85C4A'};
  list.innerHTML = DATA.notifications.map(n => `
    <div class="notif-item ${n.read?'':'unread'}" onclick="this.classList.remove('unread')">
      <div class="notif-icon" style="background:${colors[n.type]}">${icon(n.type==='warning'?'activity':n.type==='success'?'check-square':'bell',18)}</div>
      <div>
        <div class="fw-600" style="font-size:13px">${n.title}</div>
        <div class="text-muted" style="font-size:12px">${n.msg}</div>
        <div class="text-muted" style="font-size:11px;margin-top:2px">${n.time}</div>
      </div>
    </div>
  `).join('');
}
function toggleNotifications() {
  document.getElementById('notif-panel').classList.toggle('show');
  document.getElementById('user-dropdown').classList.remove('show');
}
function markAllRead() {
  DATA.notifications.forEach(n => n.read = true);
  renderNotifications();
  showToast('info','Notifications','All notifications marked as read.');
}
function toggleUserMenu() {
  document.getElementById('user-dropdown').classList.toggle('show');
  document.getElementById('notif-panel').classList.remove('show');
}

// -------------------- TOAST --------------------
function showToast(type, title, msg) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = {
    success: '<polyline points="20 6 9 17 4 12"/>',
    error: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    warning: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'
  };
  toast.innerHTML = `
    <div class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">${icons[type]}</svg></div>
    <div class="toast-content"><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>
    <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('removing');
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('global-search')?.focus();
  }
});
